[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightmind-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff", "mypy", "aviconv-asterix"]
bench = ["duckdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs the FlightMind Postgres database"]

[tool.setuptools]
packages = ["flightmind_pipeline"]

