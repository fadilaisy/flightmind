# This file exists only so Vercel can build the public URL (SCRUM-38); it is not a package for the repo.
[project]
name = "flightmind-deploy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110"]

[tool.vercel]
entrypoint = "infra.vercel_entry:app"

[tool.vercel.scripts]
build = "python infra/vercel_build.py"

# So `pytest` run from the repo root finds the services/intel tests (same as running it
# from services/intel, which has its own pytest.ini).
[tool.pytest.ini_options]
testpaths = ["services/intel/tests"]
pythonpath = ["services/intel"]
